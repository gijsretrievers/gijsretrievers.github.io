name: Publiceer op GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installeren en bouwen
        run: |
          npm ci
          # Heet de repo <naam>.github.io, dan staat de site op de hoofdmap.
          # Anders staat hij in een submap met de naam van de repo, bijv. /retrievers/
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io ]]; then BASE="/"; else BASE="/$REPO/"; fi
          echo "base-href: $BASE"
          npx ng build --base-href "$BASE"
          # Truc zodat pagina's ook direct (of na verversen) werken
          cp dist/retrievers/browser/index.html dist/retrievers/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/retrievers/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
